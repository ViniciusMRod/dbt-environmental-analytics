name: dbt CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: analytics
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_PROFILES_DIR: .
      DBT_PG_HOST: localhost
      DBT_PG_PORT: "5434"
      DBT_PG_USER: postgres
      DBT_PG_PASSWORD: dbt
      DBT_PG_DBNAME: analytics
      DBT_PG_SCHEMA: dbt_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Check connection
        run: dbt debug

      - name: Build seeds, models and tests
        run: dbt build --full-refresh
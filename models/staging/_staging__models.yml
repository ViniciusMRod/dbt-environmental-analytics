version: 2

models:
  - name: stg_water_quality
    description: "1:1 cleanup of the water source: trim, case normalization, standardized column names."
    columns:
      - name: sample_id
        description: "Sample identifier in the source system."
        data_tests: [unique, not_null]
      - name: collected_date
        description: "Date the sample was collected."
        data_tests: [not_null]
      - name: matrix
        description: "Environmental matrix of the sample."
        data_tests:
          - accepted_values:
              arguments:
                values: ['water']

  - name: stg_air_quality
    description: "1:1 cleanup of the air quality source."
    columns:
      - name: sample_id
        description: "Sample identifier in the source system."
        data_tests: [unique, not_null]
      - name: collected_date
        description: "Date the sample was collected."
        data_tests: [not_null]
      - name: matrix
        description: "Environmental matrix of the sample."
        data_tests:
          - accepted_values:
              arguments:
                values: ['air']